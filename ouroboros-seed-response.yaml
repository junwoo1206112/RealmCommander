### Question: Concrete success criteria per area?
**Answer:**
1. Networking: Two Unity instances can host+join, see each other's units move, combat syncs
2. AI: Enemy units spawn, walk toward player base, attack player units on contact
3. VFX: Unit spawn flash effect, skill impact/projectile/aura effects
4. Audio: AudioManager singleton, SFX playback on select/attack/spawn actions
5. UI: MainMenu → Lobby (host/join) → GameScene → Result → Lobby cycle

