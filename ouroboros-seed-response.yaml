## Core Question Resolution

### Question: Single-player vs AI or Mirror networked 1v1?
**Answer:** BOTH. The project already has both systems implemented:
- **Option C variant** (Full networked 1v1 with AI fallback):
  - Mirror networking: NetworkManager, NetworkPlayer, NetworkGameManager, CombatManager (server-authoritative)
  - AI Controller: AIController with Easy/Normal/Hard difficulty for single-player practice mode
  - Game supports both: Host a networked game OR play vs AI

### Question: Match flow?
**Answer:** 
1. Lobby: Host game or join via IP
2. Game start: Each player gets a base, hero, and resource generator
3. RTS phase: Build units, gather resources, scout
4. RPG phase: Level up hero, use skills, equip items
5. Combat phase: Units + hero fight enemy units + base
6. Victory: All enemy units/base destroyed → Result screen
7. Return to lobby

